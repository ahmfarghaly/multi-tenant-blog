server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:directory_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  regional:
    eu-url: http://localhost:8082
    me-url: http://localhost:8083
    apac-url: http://localhost:8084
